<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专家画像</title>
  <script src="./data.js"></script>
  <style>
    :root{--navy:#16365f;--blue:#2f69e1;--accent:#e86c3a;--ink:#10213c;--muted:#64748b;--panel:#fff;--shadow:0 18px 40px rgba(16,33,60,.10)}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f6f9fc,#edf3f8);color:var(--ink)}
    .shell{padding:22px}.hero{padding:28px;border-radius:28px;background:linear-gradient(120deg,#123055,#22487c 62%,#2f69e1);color:#fff;box-shadow:0 22px 46px rgba(18,48,85,.22)}.hero a{display:inline-block;color:#fff;text-decoration:none;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12);margin-bottom:18px}
    .hero-main{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:34px;font-weight:700}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;line-height:1.8;color:rgba(255,255,255,.86)}.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tag{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px}
    .grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:22px;margin-top:22px}.col{display:grid;gap:22px;align-content:start}.card{background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:22px}.card h2{margin:0 0 16px}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.info-item{padding:14px 16px;border-radius:16px;background:linear-gradient(180deg,#f8fbff,#f3f8fd);border:1px solid rgba(148,163,184,.14)}.info-item span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.info-item strong{display:block;font-size:15px;line-height:1.6}
    .timeline-item{padding-left:18px;border-left:3px solid rgba(47,105,225,.18);position:relative;margin-bottom:18px}.timeline-item::before{content:"";position:absolute;left:-7px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent)}.muted{color:var(--muted);margin-bottom:6px}
    .list{display:grid;gap:14px}.entry{padding:16px;border-radius:18px;background:#f8fbff;border:1px solid rgba(148,163,184,.14)}.entry h3{margin:0 0 10px;font-size:16px;line-height:1.6}.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(47,105,225,.1);color:var(--navy);font-size:12px}.entry p{margin:0 0 8px;line-height:1.75;color:var(--ink)}.entry p:last-child{margin-bottom:0}
    .network-wrap{background:linear-gradient(180deg,#0d1b2a,#122338);border-radius:18px;padding:10px;position:relative}.network-tooltip{position:absolute;display:none;background:rgba(15,23,42,.94);color:#fff;padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.5;pointer-events:none;max-width:220px}svg{width:100%;height:420px;display:block}.link{stroke:rgba(117,167,255,.45)}.node{cursor:pointer}.label{fill:#dce7f5;font-size:12px}.edge-label{fill:#9fc3ff;font-size:11px}
    @media (max-width:1024px){.grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <a href="javascript:history.back()">返回上一页</a>
      <div class="hero-main">
        <div class="avatar" id="avatar"></div>
        <div>
          <h1 id="name"></h1>
          <p id="meta"></p>
          <div class="tags" id="directionTags"></div>
        </div>
      </div>
    </header>
    <main class="grid">
      <div class="col">
        <section class="card"><h2>学者基本信息</h2><div class="info-grid" id="basicInfo"></div></section>
        <section class="card"><h2>教育经历</h2><div class="list" id="educationList"></div></section>
        <section class="card"><h2>参与课题时间线</h2><div id="topicTimeline"></div></section>
        <section class="card"><h2>承担项目</h2><div class="list" id="projectList"></div></section>
      </div>
      <div class="col">
        <section class="card"><h2>论文发表</h2><div class="list" id="paperList"></div></section>
        <section class="card"><h2>参与的学术讲座</h2><div class="list" id="lectureList"></div></section>
        <section class="card"><h2>学术合作网络</h2><div class="network-wrap"><div class="network-tooltip" id="networkTooltip"></div><svg id="networkSvg" viewBox="0 0 420 360" preserveAspectRatio="xMidYMid meet"></svg></div></section>
      </div>
    </main>
  </div>
  <script>
    const { getExpertByName, TOPICS, LECTURES, buildExpertNetwork } = window.ResearchPlatformData;
    const name = new URLSearchParams(window.location.search).get("name") || "陈知衡";
    const expert = getExpertByName(name) || getExpertByName("陈知衡");
    const relatedTopics = TOPICS.filter((topic) => topic.leadExperts.includes(expert.name) || expert.topics.includes(topic.id)).sort((a,b) => b.year - a.year);
    const relatedLectures = LECTURES.filter((lecture) => lecture.experts.includes(expert.name)).sort((a,b) => String(b.date).localeCompare(String(a.date)));
    const degreeSchools = ["中国政法大学","北京大学","中国人民大学","武汉大学","吉林大学","西南政法大学","华东政法大学"];
    const cities = ["北京","上海","武汉","南京","广州","杭州","重庆","厦门"];
    const projectGrades = ["优秀","良好","合格"];

    function hash(value) {
      let output = 0;
      String(value || "").split("").forEach((char) => { output = (output * 33 + char.charCodeAt(0)) % 1000003; });
      return output;
    }
    function unique(list) { return Array.from(new Set(list)); }
    function buildEducationProfile(currentExpert) {
      const seed = hash(currentExpert.name);
      const bachelorSchool = degreeSchools[seed % degreeSchools.length];
      const masterSchool = degreeSchools[(seed + 2) % degreeSchools.length];
      const doctorSchool = degreeSchools[(seed + 4) % degreeSchools.length];
      return [
        { period: "1998-2002", label: "本科", text: `${bachelorSchool} 法学专业` },
        { period: "2002-2005", label: "硕士", text: `${masterSchool} 法学理论/部门法学方向` },
        { period: "2005-2008", label: "博士", text: `${doctorSchool} 法学博士，聚焦${currentExpert.directions[0] || "法学"}研究` }
      ];
    }
    function buildPapers(currentExpert, topics) {
      return topics.slice(0, 5).map((topic, index) => {
        const authors = unique([currentExpert.name].concat((topic.leadExperts || []).slice(1, 3)));
        return {
          title: topic.title,
          summary: `围绕${topic.direction}中的${topic.keywords.slice(0, 3).join("、")}等核心议题，结合${topic.keywords.slice(3, 5).join("、") || "规范解释"}展开分析，重点回应当前法治实践中的制度优化需求。`,
          authors: authors.join("、"),
          date: `${topic.year}-${String((index % 9) + 3).padStart(2, "0")}`
        };
      });
    }
    function buildProjects(currentExpert, topics) {
      return topics.slice(0, 6).map((topic, index) => {
        const participants = unique((topic.leadExperts || []).concat(currentExpert.directions.map((_, directionIndex) => {
          return topic.leadExperts[(directionIndex + 1) % topic.leadExperts.length];
        }))).slice(0, 4);
        const isLead = (topic.leadExperts || [])[0] === currentExpert.name || index % 2 === 0;
        return {
          name: topic.title,
          type: topic.type,
          leader: isLead ? currentExpert.name : (topic.leadExperts[0] || currentExpert.name),
          members: participants.join("、"),
          period: `${topic.year} - ${topic.year + 2}`,
          grade: projectGrades[(hash(topic.id) + index) % projectGrades.length]
        };
      });
    }
    function buildLectureItems(currentExpert, lectures) {
      return lectures.slice(0, 6).map((lecture, index) => {
        const speaker = lecture.experts[0] === currentExpert.name ? currentExpert.name : lecture.experts[0];
        const discussants = lecture.experts.filter((person) => person !== speaker);
        return {
          theme: lecture.name,
          speaker,
          discussants: discussants.join("、") || currentExpert.name,
          date: lecture.date,
          place: `${cities[(hash(lecture.id) + index) % cities.length]} · ${["法学院报告厅","法治论坛会议室","学术交流中心","研究生院礼堂"][(hash(lecture.name) + index) % 4]}`
        };
      });
    }

    const education = buildEducationProfile(expert);
    const papers = buildPapers(expert, relatedTopics);
    const projects = buildProjects(expert, relatedTopics);
    const lectures = buildLectureItems(expert, relatedLectures);

    document.getElementById("avatar").textContent = expert.name.slice(0,1);
    document.getElementById("name").textContent = expert.name;
    document.getElementById("meta").textContent = `${expert.institution} · ${expert.title} · ${expert.profile}`;
    document.getElementById("directionTags").innerHTML = expert.directions.map((direction) => `<span class="tag">${direction}</span>`).join("");
    document.getElementById("basicInfo").innerHTML = `
      <div class="info-item"><span>姓名</span><strong>${expert.name}</strong></div>
      <div class="info-item"><span>工作单位</span><strong>${expert.institution}</strong></div>
      <div class="info-item"><span>职称</span><strong>${expert.title}</strong></div>
      <div class="info-item"><span>研究方向</span><strong>${expert.directions.join("、")}</strong></div>
    `;
    document.getElementById("educationList").innerHTML = education.map((item) => `<article class="entry"><div class="meta-row"><span class="pill">${item.period}</span><span class="pill">${item.label}</span></div><h3>${item.text}</h3></article>`).join("");
    document.getElementById("topicTimeline").innerHTML = relatedTopics.map((topic) => `<article class="timeline-item"><div class="muted">${topic.year} 年 · ${topic.type}</div><div><strong>${topic.title}</strong></div><div>${topic.direction} · 关键词：${topic.keywords.slice(0,4).join(" / ")}</div></article>`).join("");
    document.getElementById("paperList").innerHTML = papers.map((paper) => `<article class="entry"><h3>${paper.title}</h3><div class="meta-row"><span class="pill">发表时间 ${paper.date}</span></div><p><strong>摘要：</strong>${paper.summary}</p><p><strong>作者列表：</strong>${paper.authors}</p></article>`).join("") || '<div class="muted">暂无代表论文。</div>';
    document.getElementById("projectList").innerHTML = projects.map((project) => `<article class="entry"><h3>${project.name}</h3><div class="meta-row"><span class="pill">${project.type}</span><span class="pill">项目时间 ${project.period}</span><span class="pill">结项等级 ${project.grade}</span></div><p><strong>负责人：</strong>${project.leader}</p><p><strong>参与人：</strong>${project.members}</p></article>`).join("") || '<div class="muted">暂无项目数据。</div>';
    document.getElementById("lectureList").innerHTML = lectures.map((lecture) => `<article class="entry"><h3>${lecture.theme}</h3><div class="meta-row"><span class="pill">${lecture.date}</span><span class="pill">${lecture.place}</span></div><p><strong>主讲人：</strong>${lecture.speaker}</p><p><strong>与谈人：</strong>${lecture.discussants}</p></article>`).join("") || '<div class="muted">暂无学术讲座数据。</div>';
    const network = buildExpertNetwork(expert.name);
    const svg = document.getElementById("networkSvg");
    const tooltip = document.getElementById("networkTooltip");
    const nodeByName = new Map(network.nodes.map((node) => [node.name, node]));
    let markup = "";
    network.links.forEach((link) => {
      const source = nodeByName.get(link.source); const target = nodeByName.get(link.target);
      markup += `<line class="link" x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}" stroke-width="${1 + link.value}"></line>`;
      markup += `<text class="edge-label" x="${(source.x + target.x) / 2}" y="${(source.y + target.y) / 2 - 4}" text-anchor="middle">${link.value}次</text>`;
    });
    network.nodes.forEach((node) => {
      markup += `<circle class="node" cx="${node.x}" cy="${node.y}" r="${node.value}" fill="${node.category === 'core' ? '#e86c3a' : '#3f82f2'}" data-name="${node.name}" data-institution="${node.institution}" data-directions="${node.directions.join(' / ')}"></circle>`;
      markup += `<text class="label" x="${node.x}" y="${node.y + node.value + 16}" text-anchor="middle">${node.name}</text>`;
    });
    svg.innerHTML = markup;
    svg.querySelectorAll(".node").forEach((node) => {
      node.addEventListener("mousemove", (event) => {
        tooltip.style.display = "block";
        tooltip.style.left = event.offsetX + 16 + "px";
        tooltip.style.top = event.offsetY + 16 + "px";
        tooltip.innerHTML = `<strong>${node.dataset.name}</strong><br>${node.dataset.institution}<br>${node.dataset.directions}`;
      });
      node.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
      node.addEventListener("click", () => { if (node.dataset.name !== expert.name) { window.location.href = `./expert.html?name=${encodeURIComponent(node.dataset.name)}`; } });
    });
  </script>
</body>
</html>
